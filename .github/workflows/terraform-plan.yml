name: terraform-plan

on:
    workflow_dispatch:
    # Replace this with your desired triggers, e.g., pull_request or push
    #pull_request:
    #    branches: [main]
    #push:
    #    branches: [main]

permissions:
    id-token: write
    contents: read

concurrency:
    group: terraform-plan-${{ github.ref }}
    cancel-in-progress: true

jobs:
    plan:
        runs-on: ubuntu-latest
        env:
            ARM_USE_OIDC: "true"
            ARM_USE_AZUREAD: "true"
            ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        steps:
            - uses: actions/checkout@v4

            - uses: ./.github/actions/terraform-plan
              with:
                  tfstate_subscription_id: ${{ vars.TFSTATE_SUBSCRIPTION_ID }}
                  tfstate_resource_group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
                  tfstate_storage_account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
                  tfstate_container: ${{ vars.TFSTATE_CONTAINER }}
